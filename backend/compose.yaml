name: loadpulse-api
services:
  postgres:
    image: postgres:17
    container_name: loadpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loadpulse
      POSTGRES_USER: loadpulse
      POSTGRES_PASSWORD: loadpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadpulse -d loadpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: