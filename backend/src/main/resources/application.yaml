spring:
  application:
    name: loadpulse-api

  datasource:
    url: jdbc:postgresql://localhost:5432/loadpulse
    username: loadpulse
    password: ${DB_PASSWORD:loadpulse_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration      

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always